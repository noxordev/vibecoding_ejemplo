<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis tareas</title>

  <!-- Estilos de Bootstrap desde CDN. "integrity" garantiza que el fichero descargado no ha sido modificado. -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">

        <h1 class="mb-4">Mis tareas</h1>

        <!-- Formulario para crear una tarea (POST /tareas) o editar una existente (PUT /tareas/{id}) -->
        <form id="form-tarea" class="card card-body mb-4">
          <h2 id="titulo-formulario" class="h5 mb-3">Nueva tarea</h2>
          <div class="mb-3">
            <label for="titulo" class="form-label">Título</label>
            <input id="titulo" class="form-control" required maxlength="100" placeholder="Comprar pan">
          </div>
          <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción <span class="text-body-secondary">(opcional)</span></label>
            <input id="descripcion" class="form-control" maxlength="500" placeholder="Integral, en la panadería de la esquina">
          </div>
          <div class="d-flex gap-2">
            <button id="boton-guardar" type="submit" class="btn btn-primary flex-grow-1">Añadir tarea</button>
            <!-- Solo se muestra mientras se edita una tarea -->
            <button id="boton-cancelar" type="button" class="btn btn-outline-secondary d-none">Cancelar</button>
          </div>
        </form>

        <!-- Mensaje de error: oculto (d-none) hasta que js/app.js lo muestre -->
        <div id="mensaje-error" class="alert alert-danger d-none" role="alert"></div>

        <!-- Lista de tareas: la rellena js/app.js con los datos de la API -->
        <ul id="lista-tareas" class="list-group"></ul>

      </div>
    </div>
  </main>

  <!-- Se carga al final para que todos los elementos del HTML ya existan cuando se ejecute -->
  <script src="js/app.js"></script>
</body>
</html>
